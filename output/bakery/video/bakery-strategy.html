const D={"scenes": [{"id": "S0", "dur": 8.69, "text": "사모펀드 보유 커피·베이커리 전문점의, 3년 뒤 출점 전략입니다. 입지, 인테리어, 메뉴, 손익 순서로 제안합니다.", "step": -1}, {"id": "S1a", "dur": 9.87, "text": "먼저 입지입니다. 서울 상권 1,650곳을 분석해, 제과점 5곳 이상에 분기 매출 5억 원 이상, 유동인구가 늘어난 상권 19곳을 추렸습니다.", "step": 0}, {"id": "S1b", "dur": 18.9, "text": "과거 성장이 미래를 보장하진 않아서 2029년 이전 호재를 봤습니다. 성수와 용산은 효과가 2029년 이후이고, 마곡과 청량리는 이미 반영됐습니다. 창동은 서울아레나 2027년, 동북선 2027년 말, 광운대 역세권 2028년이 목표입니다. 모두 지연 위험이 있습니다.", "step": 0}, {"id": "S1c", "dur": 11.3, "text": "최종 입지는 창동역 상권입니다. 제과점은 두 곳뿐인데 분기 제과 매출이 7.7억 원으로 2년간 30퍼센트 늘었습니다. 다만 상권축소 지표와 커피 매출 감소가 위험입니다.", "step": 0}, {"id": "S2", "dur": 14.51, "text": "인테리어는 동네 오븐입니다. 제과 매출은 50대 이상이 51퍼센트, 저녁 5시에서 9시가 36퍼센트입니다. 그래서 편안한 좌석, 오픈 베이킹 키친, 퇴근길과 공연 전 픽업 카운터로 25평을 설계했습니다.", "step": 1}, {"id": "S3", "dur": 14.88, "text": "메뉴는 낮엔 식사빵과 건강빵, 저녁엔 구움과자와 선물 세트를 키웁니다. 비중은 식사빵 29, 구움과자 22, 케이크 12, 샌드위치 8, 음료 29퍼센트이고, 객단가는 약 1만 1천 원을 목표로 합니다.", "step": 2}, {"id": "S4a", "dur": 15.64, "text": "손익은 2029년 개점 2년 차 기준입니다. 상권 매출에 연 5퍼센트 성장과 점유율을 가정해 매출 6.3억 원, 재료비 35퍼센트, 인건비 1.9억, 임대료 0.6억을 반영하면 영업이익은 0.5억 원, 8.4퍼센트입니다.", "step": 3}, {"id": "S4b", "dur": 10.87, "text": "손익분기 매출은 5.4억 원, 안전 마진은 14퍼센트뿐이고 보수 시나리오는 0.8억 원 적자입니다. 낙관은 1.4억 원 이익, 투자 회수는 약 2.2년입니다.", "step": 3}, {"id": "S5", "dur": 11.68, "text": "결론입니다. 창동역은 호재가 현실이 될 때 수익이 나는 선점형 입지입니다. 서울아레나와 동북선 일정을 확인한 뒤 계약하는 조건부 출점을 제안합니다. 출처와 가정은 부록에 있습니다.", "step": -1}], "site": {"name": "창동역 상권", "code": "3120079", "kind": "발달상권", "ix": "상권축소", "flow26": 422390.0, "flow24": 402169.0, "bak26": 765698620.0, "bak24": 589692293.0, "cof26": 455082875.0, "cof24": 616417021.0, "bak_stores": 2.0, "cof_stores": 6.0, "bak_cnt": 76216.0, "ticket": 10046.428833840664}, "scen": [{"name": "기본", "rev": 6.252290824887501, "rev_b": 4.431959324887501, "rev_c": 1.8203315, "cogs": 2.1883017887106253, "labor": 1.90276666873065, "rent": 0.612, "card": 0.10003665319820002, "mkt": 0.12504581649775, "util": 0.3, "other": 0.1, "dep": 0.4, "cost": 5.728150927137225, "op": 0.5241 $('#bCap').onclick=()=>{capOn=!capOn;document.querySelectorAll('.cap').forEach(c=>c.classList.toggle('off',!capOn));$('#bCap').textContent=capOn?'자막 끄기':'자막 켜기'};
$('#bFs').onclick=()=>{const p=$('#player');(p.requestFullscreen||p.webkitRequestFullscreen||(()=>{})).call(p)};
document.addEventListener('fullscreenchange',()=>setTimeout(fit,100));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playing?pause():play()}});
apply();
window.__p={SC,TOTAL,aud,seek,play,pause,gtv:()=>gt};
</script>
