<html lang="ko">
<head>
<meta charset="utf-8">

<style>
:root{--p:#6d28d9;--p2:#8b5cf6;--pd:#4c1d95;--pl:#f3edff;--ink:#1c1530;--soft:#6b6483;--line:#e6dff7;--bg:#f7f4fc;--card:#fff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h1.pt{font-size:clamp(20px,3.2vw,30px);margin:6px 0 4px;letter-spacing:-.5px}
p.sub{margin:0 0 12px;color:var(--soft);font-size:14px}
#player{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 24px 60px -30px rgba(76,29,149,.55);border:1px solid var(--line)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:linear-gradient(135deg,#fff 0%,#faf7ff 60%,#efe6ff 100%);overflow:hidden}
.top{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:14px;padding:0 64px}
.step{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;color:#b3a9cc;transition:.4s}
.step i{font-style:normal;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid currentColor;font-size:20px}
.step.act{color:var(--p)}
.step.act i{background:var(--p);color:#fff;border-color:var(--p)}
.arrow{color:#cfc6e6;font-size:26px}
.bar{position:absolute;left:0;top:92px;height:4px;background:var(--p2);width:0;transition:width .3s linear}
.title{position:absolute;left:64px;top:120px;font-size:62px;font-weight:900;letter-spacing:-2px;color:var(--ink)}
.title b{color:var(--p)}
.sub2{position:absolute;left:66px;top:200px;font-size:28px;color:var(--soft)}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;pointer-events:none;transition:opacity .5s}
.scene.on{opacity:1}
.cap{position:absolute;left:0;right:0;bottom:0;height:132px;background:linear-gradient(0deg,rgba(28,21,48,.92),rgba(28,21,48,.8));color:#fff;display:flex;align-items:center;justify-content:center;padding:0 60px;font-size:29px;font-weight:600;text-align:center;line-height:1.3;z-index:50}
.cap.off{display:none}
.src{position:absolute;left:64px;bottom:136px;font-size:20px;color:var(--soft)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.rv.on{opacity:1;transform:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;box-shadow:0 18px 40px -26px rgba(76,29,149,.5)}
.pcard{background:linear-gradient(145deg,var(--pd),var(--p) 60%,var(--p2));color:#fff;border-radius:34px;box-shadow:0 30px 60px -30px rgba(76,29,149,.8)}
.chip{display:inline-block;font-size:22px;font-weight:700;color:var(--p);background:var(--pl);border-radius:999px;padding:4px 18px}
.big{font-size:84px;font-weight:900;letter-spacing:-3px}
.lab{font-size:24px;color:var(--soft)}
.ln{fill:none;stroke:var(--p);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.scene.on .ln{animation:draw 2.4s ease forwards;animation-delay:calc(var(--i)*60ms + .4s)}
@keyframes draw{to{stroke-dashoffset:0}}
.tag{font-size:20px;font-weight:700;border-radius:8px;padding:2px 10px}
.tag.g{background:#ececf1;color:#6b6483}.tag.p{background:var(--p);color:#fff}.tag.r{background:#fee2e2;color:#b91c1c}.tag.o{background:#fef3c7;color:#92400e}
/* funnel */
.fun{position:absolute;left:64px;top:300px;width:1400px}
.fun .row{display:flex;align-items:center;gap:26px;margin-bottom:26px}
.fun .b{flex:none;height:96px;border-radius:20px;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;padding-left:30px;font-size:46px;font-weight:900;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);white-space:nowrap;overflow:hidden}
.fun .t{font-size:28px;font-weight:600;max-width:560px}
/* table rows */
.cand{position:absolute;left:64px;top:270px;width:1090px}
.cand .r{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:20px;padding:12px 26px;margin-bottom:12px;font-size:28px}
.cand .r.hl{border-color:var(--p);background:var(--pl);font-weight:800;box-shadow:0 14px 30px -20px rgba(109,40,217,.8)}
.cand .r b{font-size:30px}
.tl{position:absolute;left:1200px;top:270px;width:660px;height:600px}
/* kpi */
.kpi{position:absolute;display:flex;flex-direction:column;justify-content:center;padding:26px 34px;width:420px;height:210px}
.kpi .v{font-size:78px;font-weight:900;letter-spacing:-3px;line-height:1}
.kpi .d{font-size:26px;margin-top:8px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.plan{position:absolute;left:64px;top:270px;width:1000px;height:640px}
.maps{position:absolute;left:1120px;top:270px;width:740px}
.maps .m{background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px 24px;margin-bottom:18px;font-size:27px}
.maps .m b{color:var(--p);font-size:30px;display:block}
.concl li{font-size:34px;margin:16px 0;font-weight:600}
.trig{display:flex;gap:22px}
.trig .t{flex:1;background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px 24px;font-size:28px}
.trig .t b{display:block;font-size:34px;color:var(--p)}
/* controls */
.ctl{display:flex;align-items:center;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.ctl button{font:inherit;font-size:15px;border:1.5px solid var(--p);background:#fff;color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer}
.ctl button.main{background:var(--p);color:#fff}
.ctl button:hover{background:var(--p2);color:#fff}
#seek{flex:1;min-width:200px;height:10px;border-radius:99px;background:var(--line);cursor:pointer;position:relative}
#seek i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--p);width:0}
#tm{font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px}
#ov{position:absolute;inset:0;z-index:100;background:rgba(28,21,48,.55);display:grid;place-items:center;cursor:pointer}
#ov span{background:#fff;color:var(--p);font-weight:900;font-size:clamp(18px,3vw,34px);padding:18px 36px;border-radius:999px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.scn{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.scn button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--soft);border-radius:8px;padding:4px 10px;cursor:pointer}
.scn button.act{border-color:var(--p);color:var(--p);font-weight:700}
section.doc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin:18px 0}
section.doc h2{margin:0 0 8px;font-size:20px;color:var(--pd)}
section.doc table{border-collapse:collapse;width:100%;font-size:14px}
section.doc th,section.doc td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
section.doc th{color:var(--soft);font-weight:600}
.k{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px}
.k.c{background:#dcfce7;color:#166534}.k.d{background:#dbeafe;color:#1e40af}.k.a{background:#fef3c7;color:#92400e}
section.doc ul{margin:6px 0;padding-left:20px;font-size:14px}
section.doc a{color:var(--p)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.phi{width:100%;height:100%;object-fit:cover;display:block;background:#e9defb}
.phx{width:100%;height:100%;background:linear-gradient(135deg,#ddd0f7,#f3edff)}
.ph{position:relative;overflow:hidden;border-radius:28px;box-shadow:0 26px 50px -30px rgba(40,20,90,.7)}
.ph .lbl{position:absolute;left:0;right:0;bottom:0;padding:70px 26px 18px;background:linear-gradient(0deg,rgba(28,21,48,.9),rgba(28,21,48,0));color:#fff;font-size:27px;font-weight:700;line-height:1.3}
.ph .lbl small{display:block;font-size:21px;font-weight:500;opacity:.9;margin-top:4px}
.ph .cr2{position:absolute;right:12px;top:10px;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);opacity:.8}
.mood{position:absolute;right:64px;top:128px;font-size:22px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:999px;padding:6px 20px;z-index:5}
.pct{position:absolute;left:16px;top:14px;font-size:44px;font-weight:900;color:#fff;background:rgba(76,29,149,.88);border-radius:16px;padding:2px 16px;letter-spacing:-1px}
.mt{background:#fff;border:2px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 20px 40px -28px rgba(76,29,149,.6)}
.mt .tx{padding:14px 18px 16px}
.mt .tx b{font-size:29px;display:block;letter-spacing:-1px}
.mt .tx span{font-size:21px;color:var(--soft);line-height:1.35;display:block;margin-top:2px}
.sbar{display:flex;height:60px;border-radius:18px;overflow:hidden;box-shadow:0 14px 30px -22px rgba(76,29,149,.7)}
.sbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:800;white-space:nowrap}
.planmini{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:reduce){.scene.on .ln{animation:none;stroke-dashoffset:0}.rv{transition:none}}
</style>
</head>

function phb(k,style,lbl,sub,at){return '<div class="ph rv" data-at="'+at+'" style="position:absolute;'+style+'">'+imgp(k)+crd(k)+(lbl?'<div class="lbl">'+lbl+(sub?'<small>'+sub+'</small>':'')+'</div>':'')+'</div>'}

 <div style="position:absolute;left:84px;top:150px;width:880px;color:#fff">
  <div style="font-size:24px;letter-spacing:4px;opacity:.85">CASE BRIEF</div>
  <div style="font-size:76px;font-weight:900;line-height:1.1;margin:22px 0 22px;letter-spacing:-3px">3년 뒤,<br>베이커리를<br>어디에 낼까요?</div>

 <svg class="tl" viewBox="0 0 660 600">

 </svg>

// ----- player -----
const aud={};
Object.keys(AUDIO).forEach(k=>{const a=new Audio(AUDIO[k]);a.preload='auto';aud[k]=a;});
let gt=0,playing=false,last=0,cur=-1,capOn=true;
function sceneAt(t){for(let i=SC.length-1;i>=0;i--)if(t>=SC[i].start)return i;return 0}
function fmt(t){t=Math.max(0,Math.min(TOTAL,t));return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')}
$('#scn').innerHTML=SC.map((s,i)=>`<button data-i="${i}">${['개요','① 후보 추리기','② 호재','③ 최종 입지','인테리어','메뉴','손익 기본','손익 시나리오','결론'][i]}</button>`).join('');
function fit(){const p=$('#player');stage.style.transform='scale('+p.clientWidth/1920+')'}
addEventListener('resize',fit);fit();try{new ResizeObserver(fit).observe($('#player'))}catch(e){}
function apply(){
  const i=sceneAt(gt),s=SC[i],lt=Math.max(0,gt-s.start);
  if(i!==cur){
    document.querySelectorAll('.scene').forEach(e=>e.classList.remove('on'));
    $('#sc_'+s.id).classList.add('on');
    document.querySelectorAll('#scn button').forEach((b,j)=>b.classList.toggle('act',j===i));
    document.querySelectorAll('#sc_'+s.id+' .rv').forEach(e=>e.classList.remove('on'));
    cur=i;
  }
  const root=$('#sc_'+s.id);
  root.querySelectorAll('.rv').forEach(e=>{const on=lt>=parseFloat(e.dataset.at||0);e.classList.toggle('on',on)});
  root.querySelectorAll('.fb').forEach(e=>{e.style.width=(lt>=parseFloat(e.dataset.at)?e.dataset.w+'px':'0')});
  const bar=root.querySelector('.bar');if(bar)bar.style.width=(gt/TOTAL*100)+'%';
  $('#seek i').style.width=(gt/TOTAL*100)+'%';$('#tm').textContent=fmt(gt)+' / '+fmt(TOTAL);
}
function startAudio(){
  const i=sceneAt(gt),s=SC[i];Object.values(aud).forEach(a=>a.pause());
  const lt=gt-s.start;if(lt<s.dur-0.05){const a=aud[s.id];try{a.currentTime=lt;a.play().catch(()=>{})}catch(e){}}
}
function loop(ts){
  if(!playing)return;
  const dt=(ts-last)/1000;last=ts;
  const i=sceneAt(gt),s=SC[i],a=aud[s.id];
  if(!a.paused&&!a.ended&&gt-s.start<s.dur){gt=s.start+a.currentTime;}else{gt+=dt;}
  const j=sceneAt(gt);
  if(j!==i||(gt-SC[j].start<0.1&&a.paused&&false)){startAudio();}
  else if(a.paused&&gt-s.start<s.dur-0.1&&gt-s.start>=0){try{a.currentTime=gt-s.start;a.play().catch(()=>{})}catch(e){}}
  document.documentElement.dataset.dbg=JSON.stringify({id:s.id,paused:a.paused,ct:+a.currentTime.toFixed(1),rs:a.readyState,err:a.error&&a.error.code,gt:+gt.toFixed(1)});
  if(gt>=TOTAL){gt=TOTAL;apply();pause();return;}
  apply();requestAnimationFrame(loop);
}
function play(){if(gt>=TOTAL-0.05)gt=0;playing=true;$('#ov').style.display='none';$('#bPlay').textContent='⏸ 일시정지';startAudio();last=performance.now();requestAnimationFrame(loop)}
function pause(){playing=false;Object.values(aud).forEach(a=>a.pause());$('#bPlay').textContent='▶ 재생'}
function seek(t){gt=Math.max(0,Math.min(TOTAL,t));cur=-1;apply();if(playing)startAudio();}
$('#bPlay').onclick=()=>playing?pause():play();
$('#ov').onclick=()=>{if(!playing)play()};
$('#seek').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();seek((e.clientX-r.left)/r.width*TOTAL)};
$('#scn').onclick=e=>{const b=e.target.closest('button');if(!b)return;seek(SC[+b.dataset.i].start+0.05)};
$('#bCap').onclick=()=>{capOn=!capOn;document.querySelectorAll('.cap').forEach(c=>c.classList.toggle('off',!capOn));$('#bCap').textContent=capOn?'자막 끄기':'자막 켜기'};
$('#bFs').onclick=()=>{const p=$('#player');(p.requestFullscreen||p.webkitRequestFullscreen||(()=>{})).call(p)};
document.addEventListener('fullscreenchange',()=>setTimeout(fit,100));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playing?pause():play()}});
apply();
window.__p={SC,TOTAL,aud,seek,play,pause,gtv:()=>gt};
</script>
</body>
</html>
